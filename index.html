<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشاهداتي</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#0b0d11;--panel:#12161d;--panel2:#191f28;--line:#29313d;--text:#f5f2ed;--muted:#929cab;--accent:#ff9b54;--accent2:#ffd1a8;--danger:#ff7979;--green:#83d6b4;--shadow:0 24px 70px #0008}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{font-family:'Alexandria',system-ui,sans-serif;color:var(--text);background:radial-gradient(ellipse at 85% -10%,#59351f55,transparent 38%),radial-gradient(ellipse at 0% 30%,#17283b45,transparent 34%),var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);line-height:1.7}button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;transition:transform .2s,background .2s,border-color .2s}button:active{transform:scale(.98)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}::selection{background:#ff9b5444}
.wrap{max-width:1180px;margin:auto;padding:0 22px 110px}header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 22px;gap:16px}h1{font-size:clamp(1.45rem,4vw,2rem);font-weight:800;letter-spacing:-.04em}header h1:before{content:'';display:inline-block;width:9px;height:27px;background:var(--accent);border-radius:8px;margin-left:10px;vertical-align:-4px;box-shadow:0 0 22px #ff9b5466}.av{width:42px;height:42px;border-radius:50%;overflow:hidden;border:2px solid #ff9b5480;box-shadow:0 0 0 4px #ff9b5415}.av img{width:100%;height:100%;display:block;object-fit:cover}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 18px;padding:4px 1px 9px}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;padding:9px 17px;border-radius:999px;color:var(--muted);font-size:.85rem;background:#ffffff04;border:1px solid transparent}.tab:hover{color:var(--text);background:#ffffff08}.tab.on{background:linear-gradient(135deg,var(--accent),#e87b39);color:#21140c;font-weight:700;box-shadow:0 7px 24px #ff9b5428}
.find{width:100%;background:#11151bd9;border:1px solid var(--line);border-radius:16px;padding:14px 17px;margin:0 0 25px;outline:none;transition:.2s}.find:focus,.in:focus{border-color:#ff9b54;box-shadow:0 0 0 4px #ff9b5417}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:27px 18px}.card{text-align:right;display:block;width:100%;min-width:0;animation:rise .35s both}.poster{position:relative;aspect-ratio:2/3;border-radius:13px;overflow:hidden;background:linear-gradient(145deg,#242b35,#12161d);box-shadow:0 8px 25px #0004;isolation:isolate}.poster:after{content:'';position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#07090dd9);pointer-events:none}.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .45s,filter .3s}.card:hover .poster img{transform:scale(1.055);filter:saturate(1.08)}.ph{display:grid;place-items:center;height:100%;padding:14px;text-align:center;color:#c2c8d1;font-size:.9rem}.poster i{position:absolute;inset-inline:0;bottom:0;height:4px;background:#0008;z-index:2}.poster s{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffd2a9);box-shadow:0 0 12px #ff9b54aa}.card h3{font-size:.88rem;font-weight:600;margin:10px 1px 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.65}.card p{font-size:.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:72px 16px;background:linear-gradient(145deg,#ffffff04,#ffffff01);border:1px dashed #343d49;border-radius:22px}.empty:before{content:'✦';display:block;color:var(--accent);font-size:2rem;margin-bottom:8px}
.fab{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));inset-inline-start:23px;width:62px;height:62px;border-radius:22px;background:linear-gradient(145deg,#ffc18e,var(--accent));color:#21140c;font-size:2rem;font-weight:400;box-shadow:0 14px 38px #ff9b5438,0 3px 8px #0008;z-index:5}.fab:hover{transform:translateY(-3px) rotate(3deg)}.bg{position:fixed;inset:0;background:#05070bd9;backdrop-filter:blur(9px);display:none;align-items:flex-end;justify-content:center;z-index:10;padding-top:20px}.bg.open{display:flex;animation:fade .18s}.sheet{background:linear-gradient(160deg,#171d26,#101319 65%);border:1px solid #ffffff12;width:100%;max-width:590px;max-height:92vh;overflow:auto;border-radius:25px 25px 0 0;padding:24px 20px calc(25px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}.sheet:before{content:'';display:block;width:42px;height:4px;border-radius:9px;background:#525b68;margin:-10px auto 22px;opacity:.8}@media(min-width:700px){.bg{align-items:center;padding:20px}.sheet{border-radius:25px}.sheet:before{display:none}}input.in{width:100%;background:#0c1016;border:1px solid var(--line);border-radius:14px;padding:14px 15px;outline:none}.res{display:grid;gap:9px;margin-top:15px}.hit{display:flex;gap:13px;align-items:center;background:#0d1117;border:1px solid #252d38;border-radius:14px;padding:9px;text-align:right;width:100%;transition:.2s}.hit:hover{border-color:#9d6745;background:#171b21}.hit img,.hit .nop{width:52px;height:74px;object-fit:cover;border-radius:8px;background:var(--panel2);flex:none}.hit b{font-weight:600;font-size:.88rem;display:block}.hit span,.note{font-size:.76rem;color:var(--muted)}.note{margin-top:13px;text-align:center}.pv{display:flex;gap:16px;align-items:flex-start}.pv .poster{width:126px;flex:none;border-radius:13px}.pv h2{font-size:1.08rem;font-weight:700;line-height:1.5}.pv small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.syn{font-size:.8rem;color:#b3bbc6;margin-top:9px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.q{margin:22px 0 10px;font-size:.93rem;font-weight:600}.btns{display:grid;grid-template-columns:1fr 1fr;gap:9px}.b{background:#202731;border:1px solid #343d49;padding:12px 10px;border-radius:13px;font-size:.84rem}.b:hover{border-color:#8e674c;background:#282e37}.b.on,.b.pri{background:linear-gradient(135deg,#ffc18e,var(--accent));border-color:transparent;color:#24160d;font-weight:700}.b.del{color:var(--danger);background:#ff79790b;border-color:#ff797933}.b.wide{grid-column:1/-1}.ep{display:flex;align-items:center;justify-content:center;gap:10px;margin:21px 0;flex-wrap:wrap}.ep button{width:44px;height:44px;border-radius:13px;background:#202731;border:1px solid var(--line);font-size:1.3rem}.ep input{width:65px;text-align:center;background:#0b0e13;border:1px solid var(--line);border-radius:12px;padding:10px 4px}.ep span{color:var(--muted)}.login{min-height:86vh;display:grid;align-content:center;justify-items:center;gap:17px;text-align:center;max-width:480px;margin:auto;position:relative}.login:before{content:'✦';display:grid;place-items:center;width:84px;height:84px;border-radius:28px;background:linear-gradient(145deg,#ffc18e,var(--accent));color:#28180e;font-size:2.5rem;box-shadow:0 15px 45px #ff9b5427}.login h1{font-size:2.2rem}.login p{color:var(--muted);max-width:310px;font-size:.92rem}.login .b{padding:13px 25px;border-radius:14px}.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#f6f0e9;color:#17120e;padding:11px 18px;border-radius:13px;font-size:.84rem;display:none;z-index:20;box-shadow:var(--shadow);max-width:calc(100vw - 30px);text-align:center}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:480px){.wrap{padding-inline:15px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:21px 11px}.poster{border-radius:10px}.card h3{font-size:.78rem}.card p{font-size:.68rem}.tab{padding:8px 13px}.pv .poster{width:105px}.sheet{padding-inline:16px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bg" id="bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const fb = initializeApp({
  apiKey: "AIzaSyDmvg7yOztWN_dFLeannNscXvddofkzTUg",
  authDomain: "check-your-progres.firebaseapp.com",
  projectId: "check-your-progres",
  storageBucket: "check-your-progres.firebasestorage.app",
  messagingSenderId: "1073488376202",
  appId: "1:1073488376202:web:8bc341c1ea525b60ab1873"
});
const auth = getAuth(fb), db = getFirestore(fb);

const TYPES = {movie:'فلم', series:'مسلسل', anime:'أنمي'};
const STATUS = {watching:'أشاهده', completed:'خلصته', planned:'أريد أشاهده', dropped:'عفته'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let user = null, items = [], unsub = null, tab = 'all', q = '';
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2200); };
const col = () => collection(db, 'users', user.uid, 'items');

onAuthStateChanged(auth, u => {
  user = u; if (unsub) unsub();
  if (!u) { items = []; return render(); }
  unsub = onSnapshot(col(), s => { items = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => toast('تعذر تحميل البيانات، راجع قواعد Firestore'));
  render();
});

const pct = it => it.status === 'completed' ? 100 : (it.total ? Math.min(100, (it.cur || 0) / it.total * 100) : 0);
function ptext(it){
  if (it.type === 'movie') return STATUS[it.status];
  if (it.status === 'completed') return 'خلصته';
  if (it.status === 'dropped') return `عفته عند حلقة ${it.cur || 0}`;
  if (it.status === 'planned') return 'أريد أشاهده';
  return `حلقة ${it.cur || 0}${it.total ? ' من ' + it.total : ''}`;
}

function render(){
  const app = $('#app');
  if (!user){
    app.innerHTML = `<div class="login"><h1>مشاهداتي</h1><p>سجل وين وصلت بكل فلم ومسلسل وأنمي.</p><button class="b pri" id="go" style="padding:11px 24px">الدخول بحساب Google</button></div>`;
    $('#go').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast('فشل الدخول: ' + e.code));
    return;
  }
  const list = items.filter(i => (tab === 'all' || i.status === tab) && (!q || i.title.toLowerCase().includes(q.toLowerCase()))).sort((a, b) => (b.updated || 0) - (a.updated || 0));
  app.innerHTML = `<header><h1>مشاهداتي</h1><button class="av" id="out" aria-label="خروج"><img src="${esc(user.photoURL)}" alt=""></button></header>
  <div class="tabs">${[['all','الكل'],...Object.entries(STATUS)].map(([k,v]) => `<button class="tab ${tab===k?'on':''}" data-t="${k}">${v}</button>`).join('')}</div>
  ${items.length > 6 ? `<input class="find" id="q" type="search" placeholder="ابحث بقائمتك" value="${esc(q)}">` : ''}
  <div class="grid">${list.length ? list.map(card).join('') : `<div class="empty">${items.length ? 'ماكو نتائج' : 'اضغط + حتى تضيف أول عمل'}</div>`}</div>
  <button class="fab" id="add" aria-label="إضافة">+</button>`;
  $('#out').onclick = () => confirm('تسجيل الخروج؟') && signOut(auth);
  $('#add').onclick = openAdd;
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  document.querySelectorAll('[data-id]').forEach(b => b.onclick = () => openEdit(b.dataset.id));
  const qi = $('#q'); if (qi) qi.oninput = e => { q = e.target.value; const p = e.target.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
}
const card = it => `<button class="card" data-id="${it.id}"><div class="poster">${it.poster ? `<img loading="lazy" src="${esc(it.poster)}" alt="">` : `<div class="ph">${esc(it.title)}</div>`}<i><s style="width:${pct(it)}%"></s></i></div><h3>${esc(it.title)}</h3><p>${ptext(it)}</p></button>`;

const open = h => { $('#sheet').innerHTML = h; $('#bg').classList.add('open'); };
const close = () => $('#bg').classList.remove('open');
$('#bg').onclick = e => { if (e.target.id === 'bg') close(); };

/* ---------- بحث موحد من كل المصادر ---------- */
const jf = (url, ms = 8000) => { const c = new AbortController(), t = setTimeout(() => c.abort(), ms); return fetch(url, {signal:c.signal}).then(r => r.json()).finally(() => clearTimeout(t)); };
const strip = h => String(h || '').replace(/<[^>]*>/g, '');
const norm = s => String(s || '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
const TMDB_DEFAULT_KEY = '96c8a1a8bf3eeb80f84779361dc3177c';
const tmdbKey = () => localStorage.getItem('tmdb') || TMDB_DEFAULT_KEY;

const SOURCES = {
  anime: async q => (await jf(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=8`)).data.map(a => ({
    title:a.title_english || a.title, alt:a.title, poster:a.images?.jpg?.large_image_url, type:a.type === 'Movie' ? 'movie' : 'anime',
    total:a.episodes || 0, genres:[...a.genres, ...a.themes].map(g => g.name), year:a.year || a.aired?.prop?.from?.year || '', about:a.synopsis})),
  tv: async q => (await jf(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`)).slice(0, 8).map(({show:s}) => ({
    title:s.name, poster:s.image?.original || s.image?.medium, type:'series', genres:s.genres || [], year:(s.premiered || '').slice(0, 4), about:strip(s.summary), tvmaze:s.id})),
  movie: async q => (await jf(`https://itunes.apple.com/search?media=movie&limit=8&term=${encodeURIComponent(q)}`)).results.map(m => ({
    title:m.trackName, poster:(m.artworkUrl100 || '').replace('100x100bb', '600x600bb'), type:'movie', genres:[m.primaryGenreName].filter(Boolean), year:(m.releaseDate || '').slice(0, 4), about:m.longDescription})),
  tmdb: async q => { if (!tmdbKey()) return []; const key = tmdbKey();
    const [ar, en] = await Promise.all([
      jf(`https://api.themoviedb.org/3/search/multi?api_key=${key}&language=ar&include_adult=false&query=${encodeURIComponent(q)}`).catch(() => ({results:[]})),
      jf(`https://api.themoviedb.org/3/search/multi?api_key=${key}&language=en-US&include_adult=false&query=${encodeURIComponent(q)}`).catch(() => ({results:[]}))
    ]);
    const all = [...(ar.results || []), ...(en.results || [])]; const seen = new Set();
    return all.filter(r => r.media_type !== 'person' && (r.title || r.name)).filter(r => { const k = `${r.media_type}:${r.id}`; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 16).map(r => ({title:r.title || r.name, alt:r.original_title || r.original_name, poster:r.poster_path ? 'https://image.tmdb.org/t/p/w500' + r.poster_path : '', type:r.media_type === 'movie' ? 'movie' : 'series', year:(r.release_date || r.first_air_date || '').slice(0, 4), about:r.overview, genres:[], tmdb:[r.media_type === 'tv' ? 'tv' : 'movie', r.id]})); }
};
const score = (o, q) => { const n = [norm(o.title), norm(o.alt)], k = norm(q); return n.includes(k) ? 3 : n.some(x => x.startsWith(k)) ? 2 : n.some(x => x.includes(k)) ? 1 : 0; };

let hits = [], runId = 0, timer, lastQ = '';
function openAdd(){
  open(`<input class="in" id="sq" type="search" placeholder="ابحث عن فيلم، مسلسل، كرتون أو أنمي — عربي أو أجنبي" autofocus><div class="note">جرّب الاسم بالعربي أو الإنكليزي؛ النتائج تُجمع من أكثر من مصدر.</div><div class="res" id="res"></div><div class="note" id="nt"></div>`);
  $('#sq').oninput = e => { clearTimeout(timer); timer = setTimeout(() => run(e.target.value.trim()), 500); };
  $('#sq').onkeydown = e => { if (e.key === 'Enter') { clearTimeout(timer); run(e.target.value.trim()); } };
  $('#nt').innerHTML = `<button class="note" id="mk" style="text-decoration:underline">${tmdbKey() ? 'تغيير مفتاح TMDB' : 'بحث عربي وإنكليزي عبر TMDB'}</button>`;
  $('#mk').onclick = () => { const k = prompt('الصق مفتاح TMDB (v3) من themoviedb.org/settings/api'); if (k) { localStorage.setItem('tmdb', k.trim()); toast('انحفظ'); } };
}
async function run(query){
  if (query.length < 2) return;
  lastQ = query;
  const id = ++runId; hits = []; const res = $('#res'); res.innerHTML = '<div class="note">جاري البحث...</div>';
  const names = Object.keys(SOURCES);
  await Promise.all(names.map(n => SOURCES[n](query).catch(() => []).then(list => {
    if (id !== runId) return;
    hits = [...hits, ...list.filter(o => o.title)];
    const seen = new Set();
    hits = hits.filter(o => { const k = norm(o.title) + o.type + o.year; if (seen.has(k)) return false; seen.add(k); return true; })
      .map((o, i) => ({o, s:score(o, query), i})).sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.o);
    drawHits();
  })));
  if (id === runId && !hits.length) res.innerHTML = '<div class="note">ما لكيت شي. جرب الاسم بالإنكليزي، أو اربط TMDB للعربي.</div>';
}
function drawHits(){
  $('#res').innerHTML = hits.slice(0, 14).map((o, i) => `<button class="hit" data-i="${i}">${o.poster ? `<img src="${esc(o.poster)}" alt="">` : '<div class="nop"></div>'}<div><b>${esc(o.title)}</b><span>${TYPES[o.type]}${o.year ? ' - ' + esc(o.year) : ''}</span></div></button>`).join('');
  document.querySelectorAll('.hit').forEach(b => b.onclick = () => preview(hits[b.dataset.i]));
}

/* ---------- معاينة وتأكيد ---------- */
function preview(o){
  open(`<div class="pv"><div class="poster">${o.poster ? `<img src="${esc(o.poster)}" alt="">` : `<div class="ph">${esc(o.title)}</div>`}</div>
    <div><h2>${esc(o.title)}</h2><small>${TYPES[o.type]}${o.year ? ' - ' + esc(o.year) : ''}${o.total ? ' - ' + o.total + ' حلقة' : ''}</small><small>${esc((o.genres || []).join('، '))}</small><p class="syn">${esc(o.about || '')}</p></div></div>
  <p class="q">هذا اللي تقصده؟</p>
  <div class="btns"><button class="b pri" data-s="planned">إي، أريد أشاهده</button><button class="b pri" data-s="watching">إي، أشاهده هسه</button><button class="b pri" data-s="completed">إي، خلصته</button><button class="b" id="back">لا، ارجع للنتائج</button></div>`);
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => add(o, b.dataset.s));
  $('#back').onclick = openAddKeep;
}
function openAddKeep(){ const keep = hits; openAdd(); hits = keep; $('#sq').value = lastQ; drawHits(); }
async function add(o, status){
  try {
    if (o.tvmaze) o.total = (await jf(`https://api.tvmaze.com/shows/${o.tvmaze}/episodes`)).length;
    if (o.tmdb) { const [t, id] = o.tmdb, d = await jf(`https://api.themoviedb.org/3/${t}/${id}?api_key=${tmdbKey()}&language=ar`); o.genres = (d.genres || []).map(g => g.name); o.total = t === 'tv' ? d.number_of_episodes || 0 : 0; }
  } catch {}
  const it = {title:o.title, poster:o.poster || '', type:o.type, genres:o.genres || [], total:o.total || 0, year:o.year || '', status, cur:0, updated:Date.now()};
  if (status === 'completed') it.cur = it.total;
  const ref = await addDoc(col(), it);
  toast('انضاف'); status === 'watching' && o.type !== 'movie' ? openEdit(ref.id, {id:ref.id, ...it}) : close();
}

/* ---------- تعديل ---------- */
function openEdit(id, local){
  const it = local || items.find(i => i.id === id); if (!it) return;
  let st = it.status;
  open(`<div class="pv"><div class="poster">${it.poster ? `<img src="${esc(it.poster)}" alt="">` : `<div class="ph">${esc(it.title)}</div>`}</div><div><h2>${esc(it.title)}</h2><small>${TYPES[it.type]}${it.year ? ' - ' + esc(it.year) : ''}</small><small>${esc((it.genres || []).join('، '))}</small></div></div>
  <div class="btns" style="margin-top:16px">${Object.entries(STATUS).map(([k, v]) => `<button class="b ${st === k ? 'on' : ''}" data-s="${k}">${v}</button>`).join('')}</div>
  ${it.type === 'movie' ? '' : `<div class="ep"><button id="m" aria-label="أقل">-</button><input id="c" type="number" min="0" value="${it.cur || 0}"><button id="p" aria-label="أكثر">+</button><span>من</span><input id="t" type="number" min="0" value="${it.total || 0}"></div>`}
  <div class="btns" style="margin-top:14px"><button class="b pri" id="ok">حفظ</button><button class="b del" id="del">حذف</button></div>`);
  const c = $('#c'), t = $('#t');
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { st = b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b)); });
  if (c) {
    $('#m').onclick = () => c.value = Math.max(0, +c.value - 1);
    $('#p').onclick = () => { c.value = +c.value + 1; const on = s => { st = s; document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x.dataset.s === s)); }; if (+t.value && +c.value >= +t.value) on('completed'); else if (st === 'planned') on('watching'); };
  }
  $('#ok').onclick = async () => {
    const d = {status:st, updated:Date.now()};
    if (c) { d.cur = +c.value || 0; d.total = +t.value || 0; if (st === 'completed' && d.total) d.cur = d.total; }
    await setDoc(doc(db, 'users', user.uid, 'items', it.id), d, {merge:true}); close();
  };
  $('#del').onclick = async () => { if (confirm('تحذف "' + it.title + '"؟')) { await deleteDoc(doc(db, 'users', user.uid, 'items', it.id)); close(); } };
}
render();
</script>
</body>
</html>
